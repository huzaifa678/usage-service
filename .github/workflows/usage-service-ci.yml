name: usage-service CI

on:
  push:
    branches: [dev]
    paths: [usage-service/**]
  workflow_dispatch:

jobs:
  # Lint + unit tests run once, independent of the image matrix.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usage-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: usage-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run tests
        run: pytest

  # Build/scan/push all four images into the single `usage-service` ECR repo.
  # Distinct per-image tags (`<name>-sha-<sha>`) let one repo hold all of them:
  #   airflow      - Airflow scheduler/workers image (Option A orchestrator)
  #   aggregation  - Airflow job image (etl.aggregate)
  #   consumer     - Airflow job image (etl.ingest; includes avro/)
  #   embed        - Airflow job image (etl.embed)
  # The airflow base builds from context usage-service/airflow; the three job
  # images build from the repo-level usage-service context because they COPY
  # etl/, usage_common/ (and consumer also airflow/avro/).
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: airflow
            context: usage-service/airflow
            file: usage-service/airflow/Dockerfile
            # Accepted, non-fixable pip/setuptools-vendored findings (documented there).
            trivyignore: usage-service/airflow/.trivyignore
          - name: aggregation
            context: usage-service
            file: usage-service/airflow/Dockerfile.aggregation
          - name: consumer
            context: usage-service
            file: usage-service/airflow/Dockerfile.consumer
          - name: embed
            context: usage-service
            file: usage-service/airflow/Dockerfile.embed
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: "us-east-1"

      - name: Get ECR URL
        id: ecr
        run: |
          ECR_URL=$(aws ecr describe-repositories --repository-names usage-service \
            --query 'repositories[0].repositoryUri' --output text)
          echo "url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ${{ steps.ecr.outputs.url }}:${{ matrix.name }}-sha-${{ github.sha }}

      - name: Trivy image scan (scan-before-push gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.url }}:${{ matrix.name }}-sha-${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          # Only the airflow entry sets this; empty for the slim job images (fully gated).
          trivyignores: ${{ matrix.trivyignore }}
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        run: docker push "${{ steps.ecr.outputs.url }}:${{ matrix.name }}-sha-${{ github.sha }}"
