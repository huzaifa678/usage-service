[project]
name = "usage-service"
version = "0.1.0"
description = "Usage microservice (FastAPI read path + Kafka/Airflow ETL)"
requires-python = ">=3.11"
dependencies = [
    # Web/API
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    # Kafka consumer
    "confluent-kafka[schemaregistry]==2.15.0",
    "fastavro==1.12.2",
    # DB / migrations
    "alembic==1.18.5",
    "psycopg2-binary==2.9.12",
    "psycopg[binary]==3.2.3",
    # Data processing
    "pandas==3.0.5",
    # LLM / RAG (pgvector-backed)
    "langchain==1.3.14",
    "openai==2.53.0",
    "langchain-core==1.5.2",
    "langchain-community==0.4.2",
    "langchain-openai==1.4.1",
    "langchain-postgres==0.0.19",
    "pgvector==0.3.6",
    "sentence-transformers==5.6.1",
    # Utilities & resilience
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "pybreaker==1.4.1",
    "tenacity==9.1.4",
    # Tracing
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-requests==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
]

# Test + lint tooling. Installed by `uv sync` (default) and in CI; excluded from the
# runtime images via `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.9.6",
    "black==26.10.1",
]

[tool.uv]
# The service is run from source (api/, etl/, usage_common/ are COPYed into the
# image), not installed as a wheel — so uv manages the environment only.
package = false
# Formerly the "security overrides" block in requirements.txt: force transitive
# deps onto patched versions to keep Trivy clean. As constraints they cap whatever
# the graph pulls in (and add nothing that isn't already pulled).
constraint-dependencies = [
    "setuptools>=78.1.1",
    "wheel>=0.46.2",
    "virtualenv>=21.7.13",
    "jaraco.context>=6.1.0",
    "msgpack>=1.2.1",
    "tornado>=6.5.9",
    "urllib3>=2.8.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "venv|airflow/logs"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["venv", "airflow/logs", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"usage_common/models/__init__.py" = ["E402"]
